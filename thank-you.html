<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Thank you for starting your UNIFY application." />
  <meta name="theme-color" content="#FFFFFF" />
  <title>UNIFY Thank You</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #FFFFFF;
      --surface: #F7F9FC;
      --navy: #17325F;
      --gold: #B8801F;
      --gold-light: #D39F4C;
      --text: #10203B;
      --muted: #5E6980;
      --border: rgba(23,50,95,0.1);
      --shadow: 0 24px 60px rgba(23,50,95,0.08);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 2rem;
      font-family: 'Outfit', sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top left, rgba(211,159,76,0.12), transparent 28%),
        radial-gradient(circle at top right, rgba(23,50,95,0.08), transparent 32%),
        var(--bg);
    }
    .card {
      width: min(720px, 100%);
      padding: clamp(2rem, 4vw, 3rem);
      border-radius: 28px;
      background: rgba(255,255,255,0.9);
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      text-align: center;
    }
    .logo {
      width: 240px;
      height: 80px;
      object-fit: contain;
      display: block;
      margin: 0 auto 1.5rem;
    }
    .eyebrow {
      display: inline-block;
      font-size: 0.78rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 1rem;
    }
    h1 {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(2.8rem, 5vw, 4.2rem);
      font-weight: 400;
      line-height: 1.04;
      margin-bottom: 0.9rem;
    }
    p {
      color: var(--muted);
      font-size: 1rem;
      line-height: 1.8;
      max-width: 560px;
      margin: 0 auto;
    }
    .actions {
      margin-top: 2rem;
      display: flex;
      justify-content: center;
      gap: 1rem;
      flex-wrap: wrap;
    }
    .btn {
      appearance: none;
      border-radius: 12px;
      font-family: 'Outfit', sans-serif;
      font-size: 0.84rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      text-decoration: none;
      min-height: 48px;
      padding: 0.85rem 1.25rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.2s ease;
    }
    .btn:hover { transform: translateY(-1px); }
    .btn-primary {
      background: linear-gradient(135deg, var(--gold), #C99535);
      color: #14181F;
      box-shadow: 0 16px 28px rgba(184,128,31,0.18);
    }
    .btn-ghost {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--navy);
    }
  </style>
</head>
<body>
  <section class="card">
    <img class="logo" src="unify-logo-wide.png" alt="UNIFY logo" />
    <span class="eyebrow">Application received</span>
    <h1>Thanks for getting started.</h1>
    <p>Your application has been sent through the current site flow. Next, UNIFY can review the details and continue the conversation from there.</p>
    <div class="actions">
      <a class="btn btn-primary" href="/#top">Back to home</a>
      <a class="btn btn-ghost" href="/apply">Start another application</a>
    </div>
  </section>
</body>
</html>
